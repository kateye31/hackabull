<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReTrace · Crew map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="crew">
  <header class="topbar">
    <div class="brand"><span class="logo" aria-hidden="true"></span>ReTrace <span class="sub">Crew map</span></div>
    <div class="counts" id="counts"></div>
    <a class="btn ghost" href="/report" target="_blank" rel="noopener">Resident report form ↗</a>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <div class="filters" role="tablist">
        <button class="chip active" data-filter="open" role="tab">Open</button>
        <button class="chip" data-filter="all" role="tab">All</button>
        <button class="chip" data-filter="aerial" role="tab">From above</button>
        <button class="chip" data-filter="resident" role="tab">From residents</button>
      </div>
      <ol class="issue-list" id="list" aria-label="Issues, highest priority first"></ol>
    </aside>

    <section class="map-wrap">
      <div id="map"></div>
      <article class="detail" id="detail" hidden></article>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="/static/common.js"></script>
  <script src="/static/crew.js"></script>
</body>
</html>
